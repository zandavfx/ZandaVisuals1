# Cloudflare Pages projekt zandavisuals1 (zandavisuals.com). Od 1. 10. 2026 nastavení
# projektu v Gitu: databáze kliků pro /go/<slug> a /odkazy/stats (link-in-bio).
# Bez build příkazu, web se servíruje z kořene repozitáře jako dosud.
# Heslo statistik NENÍ tady: STATS_PASSWORD (+ volitelně STATS_USER) jako šifrovaná proměnná
# v Cloudflare (npx wrangler pages secret put STATS_PASSWORD --project-name zandavisuals1).
name = "zandavisuals1"
pages_build_output_dir = "."
compatibility_date = "2025-07-22"

[[d1_databases]]
binding = "ODKAZY_DB"
database_name = "zandavisuals-odkazy"
database_id = "09ed0ec3-5d37-4099-9c87-a91a7e0b0d77"

# Náhledy větví (<větev>.zandavisuals1.pages.dev) píšou do zvláštní databáze,
# ať zkoušky nezkreslí skutečné statistiky.
[[env.preview.d1_databases]]
binding = "ODKAZY_DB"
database_name = "zandavisuals-odkazy-nahled"
database_id = "cacf3931-f10d-4872-aedc-085d09ea745c"
